[project]
name = "saber11"
version = "0.1.0"
description = "Saber 11 Bogotá pipeline: ingestion, multivariate analysis (MANOVA, PCA) and PDF report"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14.2",
    "requests>=2.32",
    "reportlab>=4.2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pypdf>=7.0.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saber11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits real external services (deselect with -m 'not network')"]
addopts = "-m 'not network'"
